name: Publish

# Fires on a version tag. Packagist syncs from the tag on its own, so unlike
# the npm publish workflow this CANNOT PREVENT a release — by the time this
# runs, the version is already resolvable by consumers.
#
# It is still worth having, and the reason is asymmetric with npm:
#
#   - On npm the tarball is immutable, so a missing changelog entry can never
#     be repaired. The gate there must block, and does.
#   - On Packagist the changelog is served FROM THE REPO, so an entry added
#     after the tag is read by everyone who looks. Detection is therefore a
#     complete fix here, where it would not be on npm.
#
# What this replaces is silence. `particle-academy/fancy-flow-php` v0.21.0 was
# tagged and pushed with no changelog entry at all: the release script matched
# on `## [Unreleased]`, that file uses `## 0.20.0 — date` and has no Unreleased
# section, so the edit did nothing and said nothing. A consumer sitting on
# 0.16.0 was deciding whether to take five minors, and the changelog is the
# whole basis for that decision — they told us afterwards they would have
# concluded the release was empty and stayed put, had they not happened to
# diff the compare API instead.
#
# A red build within a minute of the tag is the difference between that and
# finding out from the consumer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # creates the GitHub release below

jobs:
  lab-certificate:
    # Generated by check-lab-cert-step.mjs (owner, 2026-11-10: strict). Refuses the
    # release unless Particle-Academy/lab-certificates holds a certificate, signed
    # by the lab, for THIS version at THIS commit. A package no lab benchmark covers
    # gets none, so no release; a failed fetch refuses too. Read-only, pinned, and
    # every publishing job needs it. See .ai/plans/lab-run-certificates.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the lab-certificate verifier
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: 47d5c7bf54a21c36f399a6288ae4236797b06205
          path: .lab-cert-verifier
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .lab-cert-verifier
          PIN_DIR: .lab-cert-verifier/lab-certificates
          PIN_SHA: 47d5c7bf54a21c36f399a6288ae4236797b06205
          PIN_SHA256: |
            2d64f3aa9881d0eb89917477f236fb4a17aa5703a540a4e90625a0702d0cb2d5  verify-lab-cert.mjs
            61a851ac55887a2923367e14199a1ce983a91b533428cac2758660a2e99aa44f  lab-cert-public-key.ed25519
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Lab-run certificate for this tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node .lab-cert-verifier/lab-certificates/verify-lab-cert.mjs --package "$PACKAGE" --version "$VERSION" --commit "$GITHUB_SHA" --source https://raw.githubusercontent.com/Particle-Academy/lab-certificates/main || { echo "::error::No valid lab-run certificate for $PACKAGE $VERSION at $GITHUB_SHA. Run its lab benchmarks on this commit, then php artisan lab:certify it in fancy-labs. A package no benchmark covers gets no release."; exit 1; }

  changelog:
    name: Changelog entry for this tag
    # Packagist publishes on the push, so nothing here can stop a release;
    # pre-push-tag-guard.sh is the gate that can. Needing the certificate means
    # a refused tag at least gets no GitHub release (lab-cert-ci-job.yml).
    needs: lab-certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert the tagged version is documented
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi

          # Accept both house styles: `## 1.2.3 — date` and Keep a Changelog's
          # `## [1.2.3] - date`. Matching only one is how the miss above
          # happened in the first place -- a tool that assumes a format it does
          # not check is a tool that fails quietly on the other one.
          if ! grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}."
            echo "::error::Add one -- say what a consumer must DO, not just what changed."
            echo "::error::Packagist has already published this tag; the entry is still read from the repo, so fix it on main now."
            exit 1
          fi

          # STRUCTURE, not just presence. The check above only asks whether a
          # heading for this version exists SOMEWHERE, and both changelog
          # failures this week were structural rather than missing:
          #
          #   - fancy-flow-php v0.21.0 was tagged with no entry at all (caught
          #     by the check above);
          #   - fancy-flow's changelog had four sections inserted ABOVE the
          #     [Unreleased] marker, so everything appended since -- including
          #     0.49.0 -- landed below them, and reading top-down showed 0.48.1
          #     as the newest release.
          #
          # The second would have PASSED the presence check. A consumer
          # deciding whether to upgrade reads top-down; a changelog that is
          # complete but mis-ordered tells a truthful-looking lie, and it is
          # invisible to whoever wrote it because they were looking at their
          # own entry rather than at the file.
          #
          # At release time the tagged version IS the newest, so it must be the
          # first version heading in the file. [Unreleased] may precede it.
          FIRST=$(grep -E '^## ' CHANGELOG.md                   | grep -viE '^## +\[?unreleased\]?'                   | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::A consumer reads top-down, so a complete-but-mis-ordered changelog hides this release. Move it above the older entries."
            exit 1
          fi

          echo "Found a changelog entry for ${VERSION}, and it is the newest."

      # ---------------------------------------------------------------------
      # Publish the GitHub release, from the changelog entry we just validated.
      # ---------------------------------------------------------------------
      #
      # Packagist syncing from the tag means a release can be fully published
      # and completely invisible on GitHub. `fancy-flow-php` had **v0.11.0
      # showing as "Latest" while Packagist served v0.42.0** — 31 minors of
      # shipped work, and anyone evaluating the package by browsing it saw a
      # project that looked abandoned in August. Reported by a consumer
      # integrating us, who noticed `gh release list` disagreed with what they
      # had installed.
      #
      # This step was then written THERE and only there. Measured 2026-09-21:
      # **20 of the 21 PHP repos had zero GitHub releases** — holy-sheet on
      # 2.3.4, laravel-catalog on 0.13.0, every Releases page empty. A fix
      # applied only where the problem was noticed is a fix the rest of the
      # estate never receives, and nothing reports that.
      #
      # Same family as the gate above: the release exists, and the surface a
      # human reads says otherwise.
      #
      # Automated rather than added to the ship checklist on purpose — a manual
      # step is what produced those 31. The notes come from CHANGELOG.md, so
      # there is no second description to drift from the first.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          # The section for this version, up to the next `## ` heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."
